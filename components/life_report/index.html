<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;color:#ede6da;background:transparent;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button{font:inherit}#root{width:100%;padding:4px 2px 12px}h2,h3,p{margin:0}h2{font-size:24px;font-weight:600;letter-spacing:.05em}.eyebrow{font-size:12px;color:#c6a66d;letter-spacing:.13em;margin-bottom:10px}.muted{color:#a49e95;font-size:13px;line-height:1.7}.heading{display:flex;justify-content:space-between;align-items:start;gap:16px;margin-bottom:10px}.tag{border:1px solid #5b4930;background:#2d2417;color:#e1c28b;border-radius:20px;padding:6px 12px;font-size:12px;white-space:nowrap}.chart-shell{margin:22px 0 10px;border:1px solid #35332f;background:#101114;border-radius:16px;padding:10px;overflow-x:auto}.chart-shell svg{display:block}.chart-shell [data-cycle-index]{cursor:pointer;outline:none}.candle-hit{transition:fill .15s,stroke .15s}.chart-shell [data-cycle-index]:hover .candle-hit,.chart-shell [data-cycle-index]:focus-visible .candle-hit{fill:#d2ad6420;stroke:#b08a48}.chart-shell [aria-pressed=true] .candle-hit{fill:#d2ad6418;stroke:#c6a46b;stroke-width:1}.cycle-nav{display:flex;gap:8px;overflow-x:auto;padding:6px 0 10px}.cycle-nav button{cursor:pointer;border:1px solid #3b3833;color:#aaa298;background:#171819;border-radius:10px;padding:10px 14px;white-space:nowrap}.cycle-nav button[aria-pressed=true]{background:#312719;border-color:#b78c48;color:#f2d8a5}.cycle-nav button:focus-visible,summary:focus-visible{outline:2px solid #e5c17d;outline-offset:3px}.overview{border:1px solid #50422e;border-radius:16px;padding:24px;background:linear-gradient(115deg,#282118,#171819 75%);margin:18px 0 24px}.score{color:#e8ca91;font-size:28px;white-space:nowrap;font-variant-numeric:tabular-nums}.score small{display:block;text-align:right;font-size:12px;color:#a59c8e;margin-top:5px}.headline{font-size:21px;line-height:1.65;margin:18px 0;overflow-wrap:anywhere}.takeaways{display:grid;grid-template-columns:1fr 1fr;gap:18px}.takeaways p{color:#d3cbc0;font-size:14px;line-height:1.8}.takeaways b{display:block;font-size:12px;color:#c5a572;margin-bottom:5px;font-weight:500}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{background:#17191c;border:1px solid #343439;border-radius:14px;padding:20px;min-width:0;overflow-wrap:anywhere}.card h3{font-size:17px;font-weight:600;display:flex;align-items:center;gap:10px}.card .icon{color:#c9a66c;font-size:13px;background:#30291f;width:28px;height:28px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center}.card .meaning{line-height:1.8;font-size:14px;color:#ddd6cd;margin:14px 0}.card .advice{font-size:13px;line-height:1.8;color:#b3aa9e;border-top:1px solid #323131;padding-top:12px}.card .advice b{color:#cdb581;font-weight:500;margin-right:5px}.legacy{border-left:2px solid #a58957;padding-left:10px;margin:12px 0;color:#bdb09a;font-size:13px;line-height:1.7}.card .legacy{font-size:12px}.section-label{margin:22px 0 12px;font-size:15px;color:#c1b7a8}.footnote{margin-top:14px}.period-section{margin-top:30px}.period{border:1px solid #3c3832;border-radius:14px;padding:20px;margin-top:14px;background:#151719}.period .headline{font-size:18px;margin:14px 0}.period .cards{margin-top:16px}.period h3{color:#dfc99f}.period details{margin-top:16px}.period summary{cursor:pointer;color:#cbb993;font-size:14px}.empty{padding:25px;color:#aaa}.candle-values{margin-top:14px;color:#b8b0a4;font-size:12px;line-height:1.8}.print-only{display:none}@media(max-width:780px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.overview{padding:18px}.heading{gap:10px}h2{font-size:21px}.score{font-size:23px}}@media(max-width:480px){.cards{grid-template-columns:1fr}.card{padding:16px}.takeaways{grid-template-columns:1fr;gap:12px}.headline{font-size:18px}.tag{display:none}.card .meaning{font-size:13px}.card h3{font-size:16px}}@media print{.cycle-nav,.chart-hint{display:none}.print-only{display:block}.cards{grid-template-columns:repeat(3,minmax(0,1fr))}.card,.overview,.period{break-inside:avoid}.chart-shell{overflow:visible}.chart-shell svg{min-width:0!important}.period details>*{display:block!important}}

.cycle-detail{margin-top:30px;padding-top:24px;border-top:1px solid #3c3831}.detail-title{font-size:19px;color:#dfcaa3;margin:0 0 16px;font-weight:600}.explanation-text{font-size:14px;color:#d8d1c8;line-height:1.95;white-space:pre-wrap;overflow-wrap:anywhere}.pros-cons{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0}.explanation-block{margin:16px 0}.pros-cons .explanation-block{margin:0;padding:18px;border:1px solid #373634;border-radius:12px;background:#16181a}.explanation-block h4{margin:0 0 10px;font-size:14px;color:#cbb384;font-weight:500}.explanation-block ul{margin:0;padding-left:19px;color:#c9c1b7;font-size:14px;line-height:1.9}.cycle-reasoning{padding:16px 18px;border:1px solid #3d3932;border-radius:12px;margin:16px 0 28px}.cycle-reasoning>summary{cursor:pointer;color:#cbb893;font-size:14px;line-height:1.7}.year-heading{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:30px 0 8px}.year-heading .detail-title{margin:0}.year-toggle{cursor:pointer;border:1px solid #705b38;border-radius:9px;background:#2c251a;color:#dfc69b;padding:8px 12px;font-size:12px;white-space:nowrap}.year-toggle:focus-visible{outline:2px solid #d7b879;outline-offset:3px}.annual-list{display:grid;gap:10px;margin-top:16px}.annual-row{border:1px solid #373738;background:#17191c;border-radius:12px;padding:16px 18px}.annual-row>summary{cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:16px;list-style:none}.annual-row>summary::-webkit-details-marker{display:none}.annual-label{display:flex;gap:12px;align-items:center}.annual-label strong{font-size:17px;font-variant-numeric:tabular-nums;color:#e1d5bd}.annual-label span{color:#aea391;font-size:14px}.annual-score{font-size:14px;color:#dabc80;display:flex;align-items:center;gap:12px;text-align:right}.annual-score:after{content:'+';font-size:20px;color:#a89370}.annual-row[open] .annual-score:after{content:'−'}.annual-row>.explanation-text{margin-top:14px}.annual-row>.muted{margin-top:12px}.annual-score-track{height:4px;background:#323234;border-radius:4px;margin-top:16px;overflow:hidden}.annual-score-fill{height:100%;background:#b6965d;border-radius:4px}@media(max-width:560px){.pros-cons{grid-template-columns:1fr}.year-heading{align-items:flex-start;flex-direction:column}.annual-row{padding:15px}.annual-label{gap:9px}.annual-score{font-size:12px}}@media print{.year-toggle{display:none}.annual-row{break-inside:avoid}}
</style></head><body><main id="root" aria-label="人生概览"></main>
<script id="ziping-initial-data" type="application/json"></script>
<script id="ziping-dashboard-script">
(()=>{'use strict';
const root=document.getElementById('root');let current=null,lastKey='',activeId=null,lastHeight=0,scheduled=false;
const send=(type,extra={})=>{if(window.parent!==window)window.parent.postMessage({isStreamlitMessage:true,type,...extra},'*');};
function size(){if(scheduled)return;scheduled=true;requestAnimationFrame(()=>{scheduled=false;const height=Math.ceil(root.getBoundingClientRect().height)+4;if(height!==lastHeight){lastHeight=height;send('streamlit:setFrameHeight',{height});}});}
function el(tag,cls,text){const node=document.createElement(tag);if(cls)node.className=cls;if(text!==undefined)node.textContent=text;return node;}
function cards(view){const grid=el('div','cards');const icons={wealth:'财',career:'业',relationship:'情'};
for(const card of view.cards){const node=el('article','card');const title=el('h3');title.append(el('span','icon',icons[card.key]||'·'),document.createTextNode(card.label));node.append(title,el('p','meaning',card.summary));if(card.advice){const advice=el('p','advice');advice.append(el('b','', '建议'),document.createTextNode(card.advice));node.append(advice);}if(card.legacy)node.append(el('p','legacy',card.note||'旧报告摘录'));grid.append(node);}return grid;}
function takeaways(overview){const box=el('div','takeaways');for(const [key,label] of [['opportunity','可以把握'],['caution','值得留意']]){if(!overview[key])continue;const p=el('p');p.append(el('b','',label),document.createTextNode(overview[key]));box.append(p);}return box;}
function overview(item,natal=false){const box=el('section','overview');const heading=el('div','heading'),meta=el('div');meta.append(el('div','eyebrow',natal?'原局概览':'当前查看的大运'),el('h2','',item.title||'先看这次解读的重点'));if(item.range)meta.append(el('p','muted',item.range));heading.append(meta);if(item.score){const score=el('div','score',item.score);score.append(el('small','',item.rating));heading.append(score);}box.append(heading,el('p','headline',item.overview.headline),takeaways(item.overview));if(item.ohlc){const c=item.ohlc;box.append(el('p','candle-values',`首年 ${c.open} · 末年 ${c.close} · 运内最高 ${c.high} · 运内最低 ${c.low}`));}if(item.legacy)box.append(el('p','legacy','这是已有报告的概览适配，未提供的三方面内容不会凭空补齐。重新生成第五版报告可获得独立白话解读。'));return box;}
function listBlock(label,values){const block=el('div','explanation-block');block.append(el('h4','',label));const list=el('ul');for(const value of values||[])list.append(el('li','',value));block.append(list);return block;}
function explanationBlock(label,text){const block=el('div','explanation-block');block.append(el('h4','',label),el('p','explanation-text',text||'本报告尚未提供。'));return block;}
function cycleDetail(item){
const data=item.detail||{},section=el('section','cycle-detail');
section.append(el('h3','detail-title','这步大运怎么理解'),el('p','explanation-text',data.assessment||'本报告尚未提供大运说明。'));
const pros=el('div','pros-cons');pros.append(listBlock('有利之处',data.good),listBlock('值得留意',data.bad));section.append(pros);
const reasoning=el('details','cycle-reasoning');reasoning.append(el('summary','','展开大运的详细解释与评分依据'));
for(const effect of data.effects||[])reasoning.append(explanationBlock(effect.label,effect.text));
for(const domain of data.domains||[]){reasoning.append(explanationBlock(domain.name,domain.assessment));if(domain.conditions?.length)reasoning.append(listBlock('适用条件',domain.conditions));}
for(const factor of data.factors||[])reasoning.append(explanationBlock(`${factor.label} · ${factor.score} · 权重 ${factor.weight}%`,factor.reason));
if(data.uncertainties?.length)reasoning.append(listBlock('仍需核对',data.uncertainties));reasoning.addEventListener('toggle',size);section.append(reasoning);
const years=data.years||[],heading=el('div','year-heading');heading.append(el('h3','detail-title',`运内 ${years.length} 年评分与解读`));
const toggle=el('button','year-toggle','展开全部年度解读');toggle.type='button';toggle.disabled=years.length===0;toggle.setAttribute('aria-expanded','false');heading.append(toggle);section.append(heading,el('p','muted','每年评分均在这步大运的综合分基础上调整。点击年份展开完整解释，缺少分数的年份保留待核。'));
const rows=el('div','annual-list');
years.forEach((year,index)=>{const row=el('details','annual-row');if(index===0)row.open=true;const summary=el('summary');const label=el('div','annual-label');label.append(el('strong','',String(year.year)),el('span','',year.pillar));const score=el('span','annual-score',year.score_label);summary.append(label,score);row.append(summary);if(Number.isFinite(year.score)){const track=el('div','annual-score-track'),fill=el('div','annual-score-fill');fill.style.width=Math.max(0,Math.min(100,year.score))+'%';track.setAttribute('aria-hidden','true');track.append(fill);row.append(track);}row.append(el('p','explanation-text',year.reason||'本报告尚未提供该年的解释。'));const adjustment=Number.isFinite(year.delta)?(year.delta>=0?'+':'')+year.delta:'待核';row.append(el('p','muted',`相对整运综合分的年度调整：${adjustment}`));row.addEventListener('toggle',()=>{const all=[...rows.querySelectorAll('details')].every(n=>n.open);toggle.textContent=all?'收起全部年度解读':'展开全部年度解读';toggle.setAttribute('aria-expanded',String(all));size();});rows.append(row);});
toggle.addEventListener('click',()=>{const all=[...rows.querySelectorAll('details')].every(n=>n.open);rows.querySelectorAll('details').forEach(n=>n.open=!all);toggle.textContent=all?'展开全部年度解读':'收起全部年度解读';toggle.setAttribute('aria-expanded',String(!all));size();});
section.append(rows);return section;}
function select(index){if(!current||!current.cycles[index])return;const item=current.cycles[index];activeId=item.id;root.querySelectorAll('[data-cycle-index]').forEach(n=>n.setAttribute('aria-pressed',String(Number(n.dataset.cycleIndex)===index)));const target=root.querySelector('#cycle-result');target.replaceChildren(overview(item),el('p','section-label','三个方面 · 分别看结论与建议'),cards(item),cycleDetail(item));size();}
function render(payload){current=payload;root.replaceChildren();const cycles=payload.cycles||[];
if(cycles.length){const heading=el('div','heading'),text=el('div');text.append(el('div','eyebrow','先看走势，再看每一步'),el('h2','',`子平 K 线 · ${cycles.length} 步大运`));heading.append(text,el('span','tag','命理解读参考分 · 0–100'));root.append(heading,el('p','muted',payload.score_note));const chart=el('div','chart-shell');chart.innerHTML=payload.chart;root.append(chart,el('p','muted chart-hint','点击一根 K 线，查看这步大运的三方面解读；手机上可左右滑动。金点为整运综合分，颜色表示首末年度分差。'));
const nav=el('nav','cycle-nav');nav.setAttribute('aria-label','选择大运');cycles.forEach((item,index)=>{const button=el('button','',item.title);button.type='button';button.dataset.cycleIndex=String(index);button.setAttribute('aria-pressed','false');nav.append(button);});root.append(nav);const result=el('div');result.id='cycle-result';result.setAttribute('aria-live','polite');root.append(result);const retained=cycles.findIndex(c=>c.id===activeId);select(retained<0?(payload.initial_index||0):retained);
}else root.append(overview(payload.natal,true),el('p','section-label','三个方面'),cards(payload.natal));
root.append(el('p','muted footnote',payload.scope_note));
if(payload.periods?.length){const section=el('section','period-section');section.append(el('h2','', '所选时间的重点'));for(const item of payload.periods){const period=el('article','period');period.append(el('h3','',item.title),el('p','muted',item.range),el('p','headline',item.overview.headline),takeaways(item.overview));const detail=el('details');detail.append(el('summary','', '展开这段时间的三方面解读'),cards(item));detail.addEventListener('toggle',size);period.append(detail);section.append(period);}root.append(section);}size();}
root.addEventListener('click',e=>{const target=e.target.closest('[data-cycle-index]');if(target&&root.contains(target))select(Number(target.dataset.cycleIndex));});
root.addEventListener('keydown',e=>{const target=e.target.closest('g[data-cycle-index]');if(target&&(e.key==='Enter'||e.key===' ')){e.preventDefault();select(Number(target.dataset.cycleIndex));}});
window.addEventListener('message',e=>{if(e.source!==window.parent||e.data?.type!=='streamlit:render')return;const payload=e.data.args?.payload;if(!payload)return;const key=JSON.stringify(payload);if(key===lastKey){size();return;}lastKey=key;render(payload);});
new ResizeObserver(size).observe(root);send('streamlit:componentReady',{apiVersion:1});
let closedBeforePrint=[];window.addEventListener('beforeprint',()=>{closedBeforePrint=[...document.querySelectorAll('details:not([open])')];closedBeforePrint.forEach(n=>n.open=true);});window.addEventListener('afterprint',()=>{closedBeforePrint.forEach(n=>n.open=false);closedBeforePrint=[];size();});
const initial=document.getElementById('ziping-initial-data').textContent;if(initial.trim()){try{render(JSON.parse(initial));}catch(_){root.append(el('p','empty','报告数据暂时无法显示，请使用原始 JSON 或 TXT 报告。'));}}
})();
</script></body></html>
